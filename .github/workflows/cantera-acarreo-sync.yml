# Sincroniza el acarreo de Cantera (pesadas de balanza y actividades
# manuales) con su planilla cada 20 minutos.
#
# Mismo motivo que compras-sync.yml: el plan Hobby de Vercel sólo admite
# crons diarios, así que la frecuencia real la marca este workflow y el de
# Vercel queda como red de seguridad. Reutiliza el mismo CRON_SECRET/APP_URL
# que ya están cargados en el repositorio para Compras — no hace falta
# configurar nada nuevo.

name: Sincronizar acarreo de Cantera

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  # La importación borra y recarga "cantera_pesadas" entera: si una corrida se
  # demora, la siguiente espera en vez de pisarla a mitad de camino.
  group: cantera-acarreo-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que estén las variables
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          faltan=""
          [ -n "$APP_URL" ]     || faltan="$faltan APP_URL(variable)"
          [ -n "$CRON_SECRET" ] || faltan="$faltan CRON_SECRET(secret)"

          if [ -n "$faltan" ]; then
            echo "::error::Falta configurar en el repositorio:$faltan"
            exit 1
          fi

      - name: Pedir la sincronización
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          secreto=$(printf '%s' "$CRON_SECRET" | tr -d ' \t\r\n')

          codigo=$(curl -sS -o respuesta.json -w "%{http_code}" \
            --max-time 280 \
            -H "Authorization: Bearer $secreto" \
            "${APP_URL%/}/api/cron/cantera-acarreo-sync")

          echo "HTTP $codigo"
          cat respuesta.json
          echo

          if [ "$codigo" != "200" ]; then
            echo "::error::La sincronización devolvió $codigo"
            exit 1
          fi
