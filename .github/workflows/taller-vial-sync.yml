# Sincroniza las cargas de combustible de Taller Vial con su planilla real
# cada 20 minutos.
#
# EL CRON VIVE EN vercel.json, NO ACÁ, desde el 05/11/2026. El motivo que
# estaba escrito —el plan Hobby sólo admite crons diarios— ya no vale: el plan
# es Pro. Y un cron de Actions no cumple lo que declara: éste decía cada 20
# minutos y corría cada 4 a 8 horas. Ver mantenimiento-sync.yml.
#
# Para el disparo a mano reutiliza el mismo CRON_SECRET/APP_URL del repositorio.

name: Sincronizar cargas de Taller Vial

on:
  # SIN `schedule` DESDE EL 05/11/2026: el cron volvió a vercel.json, que ahora
  # sí puede correrlo cada 10 minutos. Dejar el de acá lo dispararía dos veces,
  # desde dos programadores distintos y sin nada que los coordine.
  workflow_dispatch:

concurrency:
  # La importación borra y recarga "taller_vial_cargas" entera: si una
  # corrida se demora, la siguiente espera en vez de pisarla a mitad de
  # camino.
  group: taller-vial-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que estén las variables
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          faltan=""
          [ -n "$APP_URL" ]     || faltan="$faltan APP_URL(variable)"
          [ -n "$CRON_SECRET" ] || faltan="$faltan CRON_SECRET(secret)"

          if [ -n "$faltan" ]; then
            echo "::error::Falta configurar en el repositorio:$faltan"
            exit 1
          fi

      - name: Pedir la sincronización
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          secreto=$(printf '%s' "$CRON_SECRET" | tr -d ' \t\r\n')

          codigo=$(curl -sS -o respuesta.json -w "%{http_code}" \
            --max-time 280 \
            -H "Authorization: Bearer $secreto" \
            "${APP_URL%/}/api/cron/taller-vial-sync")

          echo "HTTP $codigo"
          cat respuesta.json
          echo

          if [ "$codigo" != "200" ]; then
            echo "::error::La sincronización devolvió $codigo"
            exit 1
          fi
