# Sincroniza Mantenimiento con sus planillas cada 15 minutos.
#
# EL CRON VIVE EN vercel.json, NO ACÁ. Hasta el 05/11/2026 era al revés, y el
# motivo escrito era que el plan Hobby de Vercel sólo admite crons diarios.
# **Ese motivo ya no vale: el plan es Pro.** Se descubrió midiendo, porque el
# comentario decía Hobby en siete archivos mientras vercel.json tenía trece
# crons y cinco de ellos disparaban todos los días a la hora exacta — con
# Hobby, que admite dos, eso es imposible.
#
# Y la vuelta no es cosmética: **un cron de Actions no cumple lo que declara.**
# Éste decía cada 15 minutos y corría cada 4 a 8 horas (medido el 05/11/2026
# sobre las últimas corridas). Desde vercel.json corre cada 10 de verdad.
#
# El endpoint se protege solo: exige el mismo CRON_SECRET, y sin él responde 503
# en vez de quedar abierto.

name: Sincronizar Mantenimiento

on:
  # SIN `schedule` DESDE EL 05/11/2026: el cron volvió a vercel.json, que ahora
  # sí puede correrlo cada 10 minutos. Dejar el de acá lo dispararía dos veces,
  # desde dos programadores distintos y sin nada que los coordine.
  # Para poder correrlo a mano desde la pestaña Actions cuando haga falta.
  workflow_dispatch:

concurrency:
  # Si una corrida se demora, la siguiente espera en vez de pisarla: la
  # sincronización de comparativas borra el espejo y lo vuelve a escribir, y
  # dos a la vez lo dejarían a medias.
  group: mantenimiento-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que estén las variables
        # Por `env:` y no interpolados en el comando, igual que en backup.yml:
        # Interpolar un secreto con la sintaxis de expresiones de Actions mete
        # su VALOR dentro del script que corre el shell, así que un secreto con
        # una comilla o un backtick rompe el test — o se ejecuta. Actions
        # enmascara el valor en el log, no en la línea de comando.
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Sin esto, curl falla con "URL rejected: No host part in the URL" y
          # hay que leer el log entero para entender que faltaba una variable.
          # Compras estuvo días fallando así, en silencio.
          faltan=""
          [ -n "$APP_URL" ]     || faltan="$faltan APP_URL(variable)"
          [ -n "$CRON_SECRET" ] || faltan="$faltan CRON_SECRET(secret)"

          if [ -n "$faltan" ]; then
            echo "::error::Falta configurar en el repositorio:$faltan"
            exit 1
          fi

      - name: Pedir la sincronización
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Sin espacios ni saltos: el secreto se pega a mano y un Enter de más
          # al final rompe el header antes de que salga de acá.
          secreto=$(printf '%s' "$CRON_SECRET" | tr -d ' \t\r\n')

          codigo=$(curl -sS -o respuesta.json -w "%{http_code}" \
            --max-time 300 \
            -H "Authorization: Bearer $secreto" \
            "${APP_URL%/}/api/cron/mantenimiento-sync")

          cat respuesta.json

          # 207 es "algunas salieron y otras no": se registra en el log y en la
          # pantalla, pero no tira abajo la corrida — lo que sí anduvo, anduvo.
          if [ "$codigo" = "200" ] || [ "$codigo" = "207" ]; then
            echo "::notice::Sincronización terminada con $codigo"
          else
            echo "::error::La sincronización devolvió $codigo"
            exit 1
          fi
