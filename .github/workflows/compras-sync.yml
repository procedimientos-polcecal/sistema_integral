# Sincroniza Compras con su planilla cada 15 minutos.
#
# El cron vive acá y no en vercel.json porque el plan Hobby de Vercel sólo
# admite crons diarios: poner una frecuencia mayor no degrada el cron, hace
# fallar el deploy entero. Desde acá la frecuencia es libre y no puede romper
# nada del lado de Vercel.
#
# El endpoint ya se protege solo: exige el mismo CRON_SECRET que usa el cron de
# Vercel, y sin él responde 503 en vez de quedar abierto.
#
# Nota sobre la puntualidad: decía "se atrasan a veces varios minutos" y eso
# subestima el problema. Medido el 14/09/2026 sobre `compras_sincronizaciones`:
# en tres días esto corrió **24 veces, no 288**, con huecos de hasta cinco
# horas. Los crons de GitHub Actions son "mejor esfuerzo": se atrasan con cola y
# directamente saltean corridas.
#
# Y el consuelo de que "el webhook ya avisa cuando alguien la edita" no cubre el
# caso que más importa. El webhook se dispara con una **edición** del master;
# una respuesta del formulario no lo edita: entra en la otra planilla y llega
# por `IMPORTRANGE`, que es un recálculo y no dispara nada. Así que los RI
# nuevos del formulario dependen **sólo** de este cron, y pueden tardar horas en
# entrar al sistema. Medido: el RI 1970 entró a la planilla 10:45 y a las 11:11
# todavía no estaba en la base.
#
# Qué se hizo con eso, para que no quede como una queja: la numeración del alta
# dejó de confiar en el máximo de la base y lo cruza con la planilla
# (`lib/compras/serieDeRi.ts`). Lo que sigue en pie es la demora en ver un
# pedido nuevo, que es molesta pero no corrompe nada.

name: Sincronizar Compras

on:
  schedule:
    - cron: "*/15 * * * *"
  # Para poder correrlo a mano desde la pestaña Actions cuando haga falta.
  workflow_dispatch:

concurrency:
  # Si una corrida se demora, la siguiente espera en vez de pisarla: la
  # importación lee y escribe la misma planilla.
  group: compras-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que estén las variables
        # Por `env:` y no interpolados en el comando, igual que en backup.yml:
        # Interpolar un secreto con la sintaxis de expresiones de Actions mete
        # su VALOR dentro del script que corre el shell, así que un secreto con
        # una comilla o un backtick rompe el test — o se ejecuta. Actions
        # enmascara el valor en el log, no en la línea de comando.
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Sin esto, curl falla con "URL rejected: No host part in the URL" y
          # hay que leer el log entero para entender que faltaba una variable.
          # Compras estuvo días fallando así, en silencio.
          faltan=""
          [ -n "$APP_URL" ]     || faltan="$faltan APP_URL(variable)"
          [ -n "$CRON_SECRET" ] || faltan="$faltan CRON_SECRET(secret)"

          if [ -n "$faltan" ]; then
            echo "::error::Falta configurar en el repositorio:$faltan"
            exit 1
          fi

      - name: Pedir la sincronización
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Sin espacios ni saltos: el secreto se pega a mano y un Enter de más
          # al final rompe el header antes de que salga de acá.
          secreto=$(printf '%s' "$CRON_SECRET" | tr -d ' \t\r\n')

          codigo=$(curl -sS -o respuesta.json -w "%{http_code}" \
            --max-time 300 \
            -H "Authorization: Bearer $secreto" \
            "${APP_URL%/}/api/cron/compras-sync")

          echo "HTTP $codigo"
          cat respuesta.json
          echo

          # Que el workflow falle cuando la sincronización falla: si no, el
          # tilde verde diría que todo anda mientras nada se actualiza.
          if [ "$codigo" != "200" ]; then
            echo "::error::La sincronización devolvió $codigo"
            exit 1
          fi
